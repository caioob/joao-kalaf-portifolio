backend:
  name: github
  repo: caioob/joao-kalaf-portifolio
  branch: content-preview
  base_url: https://joao-kalaf-portifolio.vercel.app
  auth_endpoint: /api/auth

local_backend: true
locale: pt
editor:
  preview: false
media_folder: public/images/projects
public_folder: /images/projects

collections:
  - name: projects
    label: Projetos
    label_singular: Projeto
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: false
    slug: '{{fields.title.pt}}'
    identifier_field: slug
    summary: '{{fields.title.pt}}'
    preview_path: '#project/{{slug}}'
    fields:
      - { name: id, widget: hidden, default: '' }
      - { name: slug, widget: hidden, default: '' }
      - {
          name: rank,
          label: Posição no showcase,
          widget: number,
          value_type: int,
          min: 0,
          required: false,
        }
      - name: title
        label: Título
        widget: object
        fields:
          - { name: pt, label: Português (Brasil), widget: string }
          - { name: en, label: Inglês, widget: string }
      - name: primaryDisciplineId
        label: Disciplina principal
        widget: relation
        collection: discipline_catalog
        file: disciplines
        search_fields: ['disciplines.*.label.pt', 'disciplines.*.label.en']
        display_fields: ['disciplines.*.label.pt', 'disciplines.*.label.en']
        value_field: disciplines.*.id
      - name: secondaryDisciplineIds
        label: Disciplinas secundárias
        widget: relation
        required: false
        multiple: true
        collection: discipline_catalog
        file: disciplines
        search_fields: ['disciplines.*.label.pt', 'disciplines.*.label.en']
        display_fields: ['disciplines.*.label.pt', 'disciplines.*.label.en']
        value_field: disciplines.*.id
      - name: description
        label: Narrativa do projeto
        widget: object
        required: false
        fields:
          - { name: pt, label: Português (Brasil), widget: text, required: false }
          - { name: en, label: Inglês, widget: text, required: false }
      - { name: coverMediaId, widget: hidden, default: '' }
      - name: media
        label: Galeria
        label_singular: Item
        widget: list
        types:
          - name: image
            label: Imagem
            widget: object
            summary: '{{fields.src}}'
            fields:
              - { name: id, widget: hidden, default: '' }
              - { name: type, widget: hidden, default: image }
              - { name: src, label: Arquivo de imagem, widget: image }
              - name: alt
                label: Texto alternativo
                widget: object
                fields:
                  - { name: pt, label: Português (Brasil), widget: string }
                  - { name: en, label: Inglês, widget: string }
              - name: focalPoint
                label: Ponto focal (opcional)
                widget: object
                required: false
                fields:
                  - {
                      name: x,
                      label: Horizontal (%),
                      widget: number,
                      value_type: float,
                      min: 0,
                      max: 100,
                      required: false,
                    }
                  - {
                      name: y,
                      label: Vertical (%),
                      widget: number,
                      value_type: float,
                      min: 0,
                      max: 100,
                      required: false,
                    }
              - {
                  name: isCover,
                  label: Usar como capa do projeto,
                  widget: boolean,
                  required: false,
                  default: false,
                }
              - { name: width, widget: hidden, default: '' }
              - { name: height, widget: hidden, default: '' }
          - name: video
            label: Vídeo hospedado
            widget: object
            summary: '{{fields.provider}} · {{fields.videoId}}'
            fields:
              - { name: id, widget: hidden, default: '' }
              - { name: type, widget: hidden, default: video }
              - {
                  name: provider,
                  label: Plataforma,
                  widget: select,
                  options: [youtube, vimeo, adobe-ccv],
                }
              - { name: videoId, label: ID do vídeo ou URL de incorporação, widget: string }
              - name: title
                label: Título acessível
                widget: object
                fields:
                  - { name: pt, label: Português (Brasil), widget: string }
                  - { name: en, label: Inglês, widget: string }
      - name: context
        label: Contexto do projeto
        widget: object
        required: false
        fields:
          - { name: clientOrBrand, label: Cliente ou marca, widget: string, required: false }
          - name: role
            label: Função
            widget: object
            required: false
            fields:
              - { name: pt, label: Português (Brasil), widget: string, required: false }
              - { name: en, label: Inglês, widget: string, required: false }
      - name: tools
        label: Ferramentas
        widget: list
        required: false
        field: { name: tool, label: Ferramenta, widget: string }
      - name: links
        label: Links externos
        widget: list
        required: false
        fields:
          - name: label
            label: Rótulo
            widget: object
            fields:
              - { name: pt, label: Português (Brasil), widget: string }
              - { name: en, label: Inglês, widget: string }
          - {
              name: url,
              label: URL HTTPS,
              widget: string,
              pattern: ['^https://.+', 'Use uma URL HTTPS'],
            }

  - name: discipline_catalog
    label: Disciplinas
    files:
      - name: disciplines
        label: Catálogo de disciplinas
        file: content/disciplines.json
        fields:
          - name: disciplines
            label: Disciplinas
            label_singular: Disciplina
            widget: list
            fields:
              - { name: id, widget: hidden, default: '' }
              - name: label
                label: Rótulo
                widget: object
                fields:
                  - { name: pt, label: Português (Brasil), widget: string }
                  - { name: en, label: Inglês, widget: string }
              - { name: rank, widget: hidden, default: '' }
              - { name: archived, label: Arquivar disciplina, widget: boolean, default: false }

  - name: profile
    label: Perfil
    files:
      - name: profile
        label: Perfil público
        file: content/profile.json
        fields:
          - { name: name, label: Nome, widget: string }
          - { name: logo, label: Logo (opcional), widget: image, required: false }
